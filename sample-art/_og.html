<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Newsreader';src:url('../src/styles/fonts/newsreader.woff2');font-weight:400 700}
@font-face{font-family:'Newsreader';src:url('../src/styles/fonts/newsreader-italic.woff2');font-weight:400 700;font-style:italic}
@font-face{font-family:'Noto Serif Display';src:url('../src/styles/fonts/noto-serif-display-condensed.woff2');font-weight:500 800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f4eee1;color:#15120e;font-family:Newsreader,serif;padding:18px 34px 0;display:flex;flex-direction:column}
h1{font-family:'Noto Serif Display';font-weight:800;font-size:178px;line-height:.98;text-align:center;letter-spacing:-.01em;white-space:nowrap}
.dl{border-top:4px solid #15120e;border-bottom:1px solid #15120e;margin-top:6px;padding:6px 0 7px;display:flex;justify-content:space-between;font-size:17px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.row{display:grid;grid-template-columns:505px 1fr;gap:26px;margin-top:16px;flex:1;min-height:0}
h2{font-family:'Noto Serif Display';font-weight:700;font-size:60px;line-height:1}
p{font-style:italic;font-size:24px;line-height:1.22;margin-top:12px}
.img{overflow:hidden;background:#15130f}
img{display:block;width:100%}
</style></head><body>
<h1>Noor Castellan</h1>
<div class="dl"><span>Art director and editorial designer</span><span>Lisbon</span></div>
<div class="row">
<div><h2>Magazines, books, catalogues, and the Sunday paper</h2><p>A portfolio, set and printed as a newspaper.</p></div>
<div class="img"><img src="../public/work/halyard-redesign/cover-1600.webp" alt=""></div>
</div>
</body></html>
