<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Seventh Day: three fronts</title><meta name="art-size" content="1440x960">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Libre+Franklin:wght@400;600;700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=block" rel="stylesheet"><link rel="stylesheet" href="_base.css">
<script src="_lib.js"></script><script src="_fronts.js"></script>
<style>html,body{background:#171513}.slot{position:absolute;width:450px;height:600px;overflow:hidden}.slot .front{transform:scale(.3125);transform-origin:0 0}</style></head>
<body>
<div class="abs" style="left:22px;top:690px;width:450px;color:var(--paper)"><div class="head" style="font-size:64px;line-height:1.02">Three weeks,<br>three inks</div><p style="font:400 19px/1.3 var(--text);margin-top:12px">Seventh Day, the Sunday section of The Northern Ledger. Fronts for 15, 22 and 29 September 2024.</p></div>
<div class="slot" style="left:22px;top:44px"><div class="front" id="a"></div></div>
<div class="slot" style="left:495px;top:180px"><div class="front" id="b"></div></div>
<div class="slot" style="left:968px;top:316px"><div class="front" id="c"></div></div>
<script>
Promise.all(["10px Anton","10px 'Alfa Slab One'","700 10px 'PT Serif'","800 10px 'Libre Franklin'"].map(f=>document.fonts.load(f))).then(()=>{Fronts.leek(a);Fronts.tide(b);Fronts.bus(c);window.artReady=true;});
</script></body></html>
